name: macOS runner validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: loonghao/vx@v0.9.33
        with:
          version: "0.9.33"
          cache: false
      - name: Build without publishing
        run: vx cargo build --release -p clawup --target ${{ matrix.target }}
      - name: Verify native architecture and record minimum OS
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/clawup"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          file "$binary"
          lipo "$binary" -verify_arch "$EXPECTED_ARCH"
          xcrun vtool -show-build "$binary"
          "$binary" --version
